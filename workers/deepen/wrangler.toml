# Cloudflare Python Worker that expands ("deepens") interview prep + tech
# via DeepSeek. Separate infra from the Next app (which ships to Vercel).
#
# Deploy is out-of-band (this repo's env has no Cloudflare credentials):
#   cd workers/deepen
#   npx wrangler secret put DEEPSEEK_API_KEY      # required
#   npx wrangler secret put DEEPEN_SHARED_SECRET  # optional caller auth
#   npx wrangler deploy
#
# Local: `npx wrangler dev` (put DEEPSEEK_API_KEY in workers/deepen/.dev.vars).

name = "deepen-prep"
main = "src/entry.py"
compatibility_date = "2025-05-01"
compatibility_flags = ["python_workers"]

[vars]
DEEPSEEK_BASE_URL = "https://api.deepseek.com/v1"
DEEPSEEK_MODEL = "deepseek-chat"

# DEEPSEEK_API_KEY and DEEPEN_SHARED_SECRET are secrets — set them with
# `wrangler secret put`, NEVER in [vars] (vars are plaintext in the dashboard).
