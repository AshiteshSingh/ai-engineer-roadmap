[package]
name = "audio-guide"
version = "0.1.0"
edition = "2021"
description = "Candle-based audio-optimized LangGraph knowledge artifact — generates an AudioMeta-compatible narration script with semantic chapter splits"
license = "MIT"

[features]
default = ["metal"]
metal = [
    "candle/metal",
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]
cuda = [
    "candle/cuda",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]

[[bin]]
name = "build-audio-guide"
path = "src/bin/build_audio_guide.rs"

# Deterministic markdown → AudioMeta JSON. 1:1 port of the retired
# backend/scripts/build_audio_meta.py — no LLM, reuses the tested
# markdown/wpm/audio_meta modules.
[[bin]]
name = "build-audio-meta"
path = "src/bin/build_audio_meta.rs"

# Quality + audio-experience gate over generated AudioMeta JSON.
[[bin]]
name = "audio-gate"
path = "src/bin/audio_gate.rs"

[dependencies]
candle              = { path = "../../../../../crates/candle", default-features = false }
candle-core         = "0.9"
candle-nn           = "0.9"
candle-transformers = "0.9"
hf-hub              = "0.4"
tokenizers          = "0.21"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
anyhow     = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap       = { version = "4", features = ["derive"] }
regex      = "1"
once_cell  = "1"
deepseek   = { path = "../../../../../crates/deepseek-loop", package = "deepseek-loop", default-features = false, features = ["reqwest-client"] }
tokio      = { version = "1", features = ["rt-multi-thread", "macros"] }
dotenvy    = "0.15"
toml       = "0.8"
