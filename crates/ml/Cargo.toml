[package]
name = "aer-ml"
version = "0.1.0"
edition = "2021"
description = "Unified offline ML + RAG pipeline for the AI-engineer-roadmap knowledge app: content (similarity/readability/seed), LangGraph server, topic miner, audio guide, BKT, and Udemy/Coursera/DeepLearning.AI ingestion"
license = "MIT"
autobins = false

# Single-crate replacement for the former crates/ml workspace + crates/udemy.
# Standalone: not a member of the parent ai-apps workspace.
[workspace]

[lib]
name = "aer_ml"
path = "src/lib.rs"

[features]
default = ["metal"]
metal = [
    "candle/metal",
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]
cuda = [
    "candle/cuda",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]

# ---- former knowledge-ml-core bins ----------------------------------------
[[bin]]
name = "build-similarity"
path = "src/bin/build_similarity.rs"
[[bin]]
name = "seed-dl-transcripts"
path = "src/bin/seed_dl_transcripts.rs"
[[bin]]
name = "analyze-readability"
path = "src/bin/analyze_readability.rs"
[[bin]]
name = "export-content"
path = "src/bin/export_content.rs"
[[bin]]
name = "seed-content"
path = "src/bin/seed_content.rs"
[[bin]]
name = "content-gate"
path = "src/bin/content_gate.rs"

# ---- former knowledge-ml-server bins --------------------------------------
[[bin]]
name = "knowledge-server"
path = "src/bin/knowledge-server.rs"
[[bin]]
name = "knowledge-index"
path = "src/bin/knowledge-index.rs"
[[bin]]
name = "gen-article"
path = "src/bin/gen-article.rs"
[[bin]]
name = "gen-app-prep"
path = "src/bin/gen-app-prep.rs"
[[bin]]
name = "gen-app-prep-loop"
path = "src/bin/gen-app-prep-loop.rs"
[[bin]]
name = "gen-app-prep-owner"
path = "src/bin/gen-app-prep-owner.rs"
[[bin]]
name = "gen-memorize"
path = "src/bin/gen-memorize.rs"
[[bin]]
name = "review-courses"
path = "src/bin/review-courses.rs"
[[bin]]
name = "gen-topic"
path = "src/bin/gen-topic.rs"
[[bin]]
name = "seed-topic-courses"
path = "src/bin/seed-topic-courses.rs"

# ---- former topic-miner bins ----------------------------------------------
[[bin]]
name = "mine-topics"
path = "src/bin/mine_topics.rs"
[[bin]]
name = "search-topics"
path = "src/bin/search_topics.rs"

# ---- former audio-guide bins ----------------------------------------------
[[bin]]
name = "build-audio-guide"
path = "src/bin/build_audio_guide.rs"
[[bin]]
name = "build-audio-meta"
path = "src/bin/build_audio_meta.rs"
[[bin]]
name = "audio-gate"
path = "src/bin/audio_gate.rs"

# ---- former knowledge-bkt bin (feature gate dropped; axum now unconditional)
[[bin]]
name = "bkt-server"
path = "src/bin/bkt_server.rs"

# ---- former udemy bin -----------------------------------------------------
[[bin]]
name = "udemy"
path = "src/bin/udemy.rs"

# ---- Spotify podcast rail seed (/rag) -------------------------------------
[[bin]]
name = "spotify-podcasts"
path = "src/bin/spotify_podcasts.rs"

# ---- Web article → grounding-markdown extractor ---------------------------
[[bin]]
name = "fetch-article"
path = "src/bin/fetch_article.rs"

[dependencies]
# External monorepo path deps (kept external; 4-up from crates/ml/)
candle = { path = "../../../../crates/candle", default-features = false }
candle-core         = "0.9"
candle-nn           = "0.9"
candle-transformers = "0.9"
hf-hub              = "0.4"
tokenizers          = "0.21"
deepseek = { package = "deepseek-loop", path = "../../../../crates/deepseek-loop", default-features = false, features = ["reqwest-client", "agent", "builtin-tools"] }

# Postgres (Neon) — gen-app-prep-loop persists the prep into the applications
# row. Runtime query API only (no compile-time macros → no build-time DB).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }

# Runtime / async
tokio   = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# HTTP server + client
axum    = "0.8"
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli"] }

# Storage
rusqlite     = { version = "0.32", features = ["bundled"] }
lancedb      = "0.27"
arrow-array  = "57"
arrow-schema = "57"

# Parsing / scraping / scanning
regex   = "1"
scraper = "0.22"
walkdir = "2"

# Errors / logging / CLI / misc
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap               = { version = "4", features = ["derive", "env"] }
uuid               = { version = "1", features = ["v4"] }
chrono             = { version = "0.4", features = ["serde"] }
once_cell          = "1"
dotenvy            = "0.15"

[dev-dependencies]
tempfile    = "3"
async-trait = "0.1"
